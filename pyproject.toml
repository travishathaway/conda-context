[project]
authors = [{name = "Travis Hathaway", email = "travis.j.hathaway@gmail.com"}]
dependencies = [
    "pydantic>=2.0",
    "ruamel.yaml>=0.18,<0.19",
]
name = "conda-context"
requires-python = ">= 3.11"
version = "0.1.0"
readme = "README.md"
license = {file = "LICENSE"}

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# ---------------------------------------------------------------------------
# Pixi workspace
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

# Default feature — runtime + the package itself (always active)
[tool.pixi.dependencies]
conda = "==26.5.3"

[tool.pixi.pypi-dependencies]
conda_context = { path = ".", editable = true }

[tool.pixi.tasks]
generate = "python -m conda_context.generator extract"

# Dev feature — testing, linting, pre-commit tooling
[tool.pixi.feature.dev.dependencies]
pytest = ">=7"
pytest-cov = ">=4"
ruff = ">=0.4"
pre-commit = ">=3"
prek = ">=0.4"

[tool.pixi.feature.dev.tasks]
test = "pytest tests/ -v"
test-cov = "pytest tests/ -v --cov=conda_context --cov-report=term-missing"
lint = "ruff check src/ tests/"
fmt = "ruff format src/ tests/"
pre-commit-install = "pre-commit install"
pre-commit-run = "pre-commit run --all-files"
prek = "prek"

# Environments
[tool.pixi.environments]
default = { features = [], solve-group = "main" }
dev = { features = ["dev"], solve-group = "main" }

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["conda_context"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
