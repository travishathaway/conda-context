name: Benchmarks

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow only one concurrent deployment so a new push cancels an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  benchmark:
    name: "Run benchmarks and publish report"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.73.0
          environments: py314
          cache: true

      - name: Run benchmarks
        run: |
          pixi run -e py314 pytest -m benchmark \
            --benchmark-warmup=on \
            --benchmark-min-rounds=10 \
            --benchmark-json=benchmark.json

      - name: Generate HTML report
        run: pixi run -e py314 python scripts/generate_benchmark_report.py benchmark.json

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp benchmark_report.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
